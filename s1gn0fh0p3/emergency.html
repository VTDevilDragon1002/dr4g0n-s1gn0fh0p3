<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergency SOS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><nav class="nav"><div class="container nav-inner"><a class="logo" href="home.html"><span class="logo-mark">👐</span><span>Sign of Hope</span></a><div class="nav-links"><a href="home.html">Home</a><a href="blind.html">Blind</a><a href="deaf.html">Deaf</a><a href="mute.html">Mute</a><a href="movement.html">Movement</a><a href="camera.html">Camera</a><a href="emergency.html">SOS</a></div><button class="mini-btn" id="themeToggle">Theme</button></div></nav><main class="container page-head"><span class="badge">Emergency SOS</span><h1 class="title">Emergency Alert Message</h1><p class="lead">Create a quick SOS message. Location is added only with permission.</p></main><section class="container tool-layout"><div class="card"><div class="sos">🚨</div><button class="btn danger large-tap" onclick="makeSOS()">Generate SOS</button><br><br><a class="btn secondary" id="smsLink" href="#">Open SMS</a></div><div class="card big-output" id="sosText">Press SOS to generate emergency message.</div></section><script>async function makeSOS(){const loc=await getLocationText();const text='EMERGENCY! I need help immediately. '+loc;document.getElementById('sosText').textContent=text;document.getElementById('smsLink').href='sms:?body='+encodeURIComponent(text);speak(text);vibrate(500)}</script><footer class="footer"><div class="container">© <span id="year"></span> Sign of Hope — Accessibility support project by VT.</div></footer><script src="assets/js/app.js"></script></body></html>
