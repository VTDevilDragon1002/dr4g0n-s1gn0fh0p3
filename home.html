<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OASIS - Home</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

     header {
    display: flex;
    align-items: center;
    gap: 15px;
    background-color: #e63946; /* Keep your red background */
    padding: 20px;
    border-radius: 10px;
  }

  .logo {
    width: 60px;     /* Adjust these values to match the old red box size */
    height: 60px;
    border-radius: 10px;
    object-fit: cover;
  }




    /* === Animated Red Background === */
    body {
      height: 100vh;
      background: linear-gradient(120deg, #ff0000, #ff3333, #ff4d4d);
      background-size: 400% 400%;
      animation: bgMove 6s infinite alternate ease-in-out;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      color: white;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      text-align: center;
      margin-top: 40px;
      animation: fadeIn 1s ease forwards;
    }

    header h1 {
      font-size: 2.5rem;
      letter-spacing: 3px;
      font-weight: 800;
      text-shadow: 0 0 25px rgba(255,255,255,0.8);
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
      margin-top: 8px;
    }

    /* === Buttons Grid === */
    .button-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 90%;
      max-width: 500px;
      margin-top: 40px;
      animation: fadeIn 1.5s ease forwards;
    }

    /* === Base Button Style (Dark Red Buttons) === */
    .btn {
      border: none;
      border-radius: 20px;
      padding: 25px 10px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(145deg, #990000, #660000);
      box-shadow: 0 8px 0 #330000;
      text-decoration: none;
      transition: all 0.3s ease;
      transform: perspective(800px) translateZ(0);
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: slideUp 0.7s ease forwards;
    }

    /* === Button entrance animation === */
    @keyframes slideUp {
      from { transform: translateY(100px) scale(0.8); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* === Delay per button === */
    .btn:nth-child(1) { animation-delay: 0.3s; }
    .btn:nth-child(2) { animation-delay: 0.5s; }
    .btn:nth-child(3) { animation-delay: 0.7s; }
    .btn:nth-child(4) { animation-delay: 0.9s; }
    .btn:nth-child(5) { animation-delay: 1.1s; }
    .btn:nth-child(6) { animation-delay: 1.3s; }

    /* === Larger Blind Button === */
    .btn-blind {
      grid-column: span 2;
      font-size: 1.4rem;
      padding: 35px 10px;
      background: linear-gradient(145deg, #800000, #4d0000);
      box-shadow: 0 10px 0 #2b0000;
    }

    /* === Emoji === */
    .btn span {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    /* === 3D Hover === */
    .btn:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 12px 0 rgba(0,0,0,0.5);
    }

    /* === Click / Press Animation === */
    .btn:active {
      transform: translateY(6px) scale(0.97);
      box-shadow: 0 4px 0 rgba(0,0,0,0.5) inset;
      animation: vibrate 0.2s linear 2;
    }

    /* === Vibration effect === */
    @keyframes vibrate {
      0%, 100% { transform: translateY(5px) rotate(0deg); }
      25% { transform: translateY(5px) rotate(2deg); }
      50% { transform: translateY(5px) rotate(-2deg); }
      75% { transform: translateY(5px) rotate(1deg); }
    }

    /* === Glow border effect === */
    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn:hover::after {
      opacity: 1;
      animation: glow 1.2s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px rgba(255,255,255,0.3); }
      to { box-shadow: 0 0 25px rgba(255,255,255,0.9); }
    }

    /* === Fade In === */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 10px;
      animation: fadeIn 2s ease forwards;
    }

  </style>
</head>
<body>
  <header>
    <img src="logo.jpg"alt="Accessibility Hands Logo" class="logo">
    <h1>Sign of Hope</h1>
    <br>

  </header>
    <p>Assistive App for Deaf, Mute & Blind Users</p>

  <div class="button-container">
    <a href="blind.html" class="btn btn-blind"><span>👁️‍🗨️</span>Blind Person</a>
    <a href="deaf.html" class="btn"><span>👂</span>Deaf Person</a>
    <a href="mute.html" class="btn"><span>🤐</span>Mute Person</a>
    <a href="deafmute.html" class="btn"><span>🧏</span>Deaf & Mute</a>
    <a href="emotion.html" class="btn"><span>😊</span>Emotion Recognition</a>
    <a href="emergency.html" class="btn"><span>🚨</span>Emergency Alert</a>
  </div>

  <footer>
    <p>© 2025 Sign of Hope | Empowering Accessibility</p>
  </footer>
</body>
</html>
