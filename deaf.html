<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deaf Person Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 40px;
      font-size: 2.5rem;
      color: #333;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    #deafBtn {
      margin: 30px 0;
      padding: 18px 45px;
      font-size: 1.5rem;
      border: none;
      border-radius: 50px;
      background: #ff5f6d;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    #deafBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 20px rgba(0,0,0,0.5);
    }

    #emojiContainer {
      width: 90%;
      max-width: 600px;
      height: 200px;
      border: 3px dashed #ff5f6d;
      border-radius: 20px;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 2rem;
      color: #ff5f6d;
      background-color: rgba(255,95,109,0.1);
      position: relative;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,95,109,0.3);
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% {
        bottom: -50px;
        opacity: 0;
      }
      50% {
        opacity: 0.6;
      }
      100% {
        bottom: 220px;
        opacity: 0;
      }
    }

    #textContainer {
      width: 90%;
      max-width: 600px;
      min-height: 100px;
      margin-top: 40px;
      border-radius: 15px;
      background: #fff8f8;
      padding: 20px;
      font-size: 1.2rem;
      color: #333;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      display: none;
      overflow-y: auto;
      animation: fadeIn 1s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>Deaf Person Mode</h1>
  <button id="deafBtn">Activate Deaf Mode</button>

  <div id="emojiContainer">
    <!-- Emoji visual area -->
  </div>

  <div id="textContainer">
    <!-- Text messages appear here -->
  </div>

  <script>
    const deafBtn = document.getElementById('deafBtn');
    const emojiContainer = document.getElementById('emojiContainer');
    const textContainer = document.getElementById('textContainer');

    let modeActive = false;
    let bubbleInterval;

    function createBubble() {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      const size = Math.random() * 40 + 20;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 90}%`;
      bubble.style.animationDuration = `${Math.random() * 4 + 4}s`;
      emojiContainer.appendChild(bubble);

      setTimeout(() => {
        bubble.remove();
      }, 6000);
    }

    deafBtn.addEventListener('click', () => {
      modeActive = !modeActive;

      if (modeActive) {
        deafBtn.textContent = "Deactivate Deaf Mode";
        emojiContainer.style.display = 'flex';
        textContainer.style.display = 'block';
        textContainer.innerHTML = "Text container activated! Messages will appear here.";

        // Start bubble animation
        bubbleInterval = setInterval(createBubble, 500);
      } else {
        deafBtn.textContent = "Activate Deaf Mode";
        emojiContainer.style.display = 'none';
        textContainer.style.display = 'none';

        // Stop bubbles
        clearInterval(bubbleInterval);
        emojiContainer.innerHTML = "";
      }
    });
  </script>

</body>
</html>
