<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Deaf Mode — Mute & Emoji Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-a:#f7f9ff;
  --accent:#ff5f6d;
  --accent-2:#6a11cb;
  --card:#ffffff;
  --muted:#6b7280;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  background:linear-gradient(135deg,#fef3f8 0%,#f0f7ff 100%);
  color:#111827;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
}
.shell{
  width:100%;
  max-width:820px;
  border-radius:18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,255,255,0.95));
  box-shadow:0 10px 30px rgba(16,24,40,0.08);
  padding:28px;
  border:1px solid rgba(17,24,39,0.04);
}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
h1{margin:0;font-size:20px;letter-spacing:-0.2px;color:#0f172a;}
.toggle{
  background: linear-gradient(90deg,var(--accent),var(--accent-2));
  color:white;
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(106,17,203,0.12);
  transition: transform .18s ease;
}
.toggle:active{ transform:scale(.98) }
.emoji-wrap{
  margin-top:20px;
  height:180px;
  border-radius:14px;
  border:3px dashed rgba(106,17,203,0.14);
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(180deg, rgba(255,95,109,0.03), rgba(106,17,203,0.03));
  position:relative;
  overflow:hidden;
}
#videoElement{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:14px;
  position:absolute;
  top:0; left:0;
}
.emoji-placeholder{
  color:var(--accent-2);
  font-size:40px;
  opacity:.95;
  pointer-events:none;
  z-index:5;
  position:absolute;
}
/* Floating shapes for flair */
.float {
  position:absolute;
  border-radius:50%;
  opacity:0.18;
  animation: floatUp linear infinite;
  filter: blur(6px);
}
.float.a{ width:100px; height:100px; left:8%; bottom:-40px; background: #ff5f6d; animation-duration:9s; }
.float.b{ width:70px; height:70px; left:70%; bottom:-20px; background: #6a11cb; animation-duration:11s; }
.float.c{ width:40px; height:40px; left:46%; bottom:-10px; background: #ffb86b; animation-duration:7s; }
@keyframes floatUp {
  0%{ transform: translateY(0) scale(.95); opacity:0; }
  20%{ opacity:0.6; }
  100%{ transform: translateY(-260px) scale(1.05); opacity:0; }
}
/* Text container */
.text-card{
  margin-top:22px;
  background:var(--card);
  border-radius:14px;
  padding:16px;
  box-shadow: 0 8px 18px rgba(16,24,40,0.06);
  border:1px solid rgba(17,24,39,0.03);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.text-row{
  display:flex;
  gap:12px;
  align-items:center;
}
.text-box{
  flex:1;
  min-height:84px;
  border-radius:10px;
  padding:12px 14px;
  background: linear-gradient(180deg,#fff,#fbfdff);
  border:1px solid rgba(15,23,42,0.04);
  font-size:15px;
  color:#0f172a;
  overflow:auto;
}
.controls{
  display:flex;
  gap:10px;
  align-items:center;
}
.icon-btn{
  width:48px;
  height:48px;
  border-radius:10px;
  display:inline-grid;
  place-items:center;
  border:none;
  cursor:pointer;
  background: linear-gradient(180deg,#fff,#f7f9ff);
  box-shadow: 0 6px 16px rgba(11,15,32,0.06);
  transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{ transform:scale(.98) }
.icon-btn.speaker{
  background: linear-gradient(180deg,#fff,#fff8f8);
  border: 1px solid rgba(255,95,109,0.08);
  box-shadow: 0 8px 18px rgba(255,95,109,0.06);
}
.icon-btn.playing{
  animation: pulse 900ms infinite;
  box-shadow: 0 10px 30px rgba(106,17,203,0.12);
}
@keyframes pulse {
  0%{ transform: scale(1) }
  50%{ transform: scale(1.06) }
  100%{ transform: scale(1) }
}
/* Mute person area */
.call-area{
  margin-top:14px;
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:space-between;
}
.call-left{
  display:flex;
  gap:12px;
  align-items:center;
}
.avatar{
  width:56px;
  height:56px;
  border-radius:12px;
  background: linear-gradient(135deg, #6a11cb, #ff5f6d);
  display:grid;
  place-items:center;
  color:white;
  font-weight:800;
  font-size:20px;
  box-shadow: 0 8px 24px rgba(106,17,203,0.14);
}
.call-meta{ font-size:14px; color:var(--muted) }
.call-meta .name{ color:#0f172a; font-weight:700; font-size:15px; }
.call-btn{
  background: linear-gradient(90deg,#f59e0b,#d97706);
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow: 0 10px 24px rgba(217,119,6,0.12);
}
/* Overlay */
.overlay{
  position:fixed;
  left:0;top:0;right:0;bottom:0;
  display:none;
  align-items:center;
  justify-content:center;
  background: rgba(11,15,32,0.35);
  z-index:80;
}
.ring-card{
  width:320px;
  background:var(--card);
  border-radius:14px;
  padding:18px;
  text-align:center;
  box-shadow: 0 18px 40px rgba(2,6,23,0.35);
  border:1px solid rgba(0,0,0,0.06);
}
.ring-meta{ display:flex; flex-direction:column; gap:10px; align-items:center; }
.ring-avatar{ width:72px; height:72px; border-radius:12px; background: linear-gradient(135deg,#6a11cb,#ff5f6d); color:white; display:grid; place-items:center; font-weight:800; font-size:22px; }
.ring-name{ font-weight:800; font-size:18px }
.ring-state{ color:var(--muted); font-size:13px }
.ring-actions{ display:flex; gap:10px; margin-top:12px; justify-content:center; }
.end-call{ background:#ef4444; color:white; border:none; padding:10px 14px; border-radius:10px; cursor:pointer }
.accept-call{ background:#16a34a; color:white; border:none; padding:10px 14px; border-radius:10px; cursor:pointer }
/* small helper */
.muted{ color:var(--muted); font-size:13px; }
</style>
</head>
<body>

<div class="shell" role="application" aria-label="Deaf mode interface">
  <div class="header">
    <h1>Mute Person Mode</h1>
    <button id="toggleBtn" class="toggle" aria-pressed="false">Activate Mute Mode</button>
  </div>

  <div id="emojiWrap" class="emoji-wrap" aria-hidden="true">
    <video id="videoElement" autoplay muted></video>
    <div class="emoji-placeholder" id="emojiPlaceholder">😀</div>
  </div>

  <div id="textCard" class="text-card" aria-hidden="true">
    <div class="text-row">
      <div id="textBox" class="text-box" contenteditable="true" role="textbox" aria-label="Message box">
        Hello — here will appear translated messages. You can edit this text and press the speaker to hear it.
      </div>
      <div class="controls">
        <button id="speakerBtn" class="icon-btn speaker" title="Read message" aria-label="Read message aloud">🔊</button>
      </div>
    </div>

    <div class="call-area">
      <div class="call-left">
        <div class="avatar" aria-hidden="true">AB</div>
        <div class="call-meta">
          <div class="name">Mute: Anna Brown</div>
          <div class="muted">Tap button to mute/unmute person</div>
        </div>
      </div>
      <div>
        <button id="callBtn" class="call-btn" aria-label="Mute person">🔇 Mute Person</button>
      </div>
    </div>
  </div>
</div>

<div id="overlay" class="overlay" role="dialog" aria-hidden="true">
  <div class="ring-card" role="document">
    <div class="ring-meta">
      <div class="ring-avatar">AB</div>
      <div class="ring-name">Anna Brown</div>
      <div id="ringState" class="ring-state">Muted…</div>
      <div class="ring-actions">
        <button id="acceptBtn" class="accept-call">Unmute</button>
        <button id="endBtn" class="end-call">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script>
const toggleBtn = document.getElementById('toggleBtn');
const emojiWrap = document.getElementById('emojiWrap');
const video = document.getElementById('videoElement');
const emojiPlaceholder = document.getElementById('emojiPlaceholder');
const textCard = document.getElementById('textCard');
const speakerBtn = document.getElementById('speakerBtn');
const textBox = document.getElementById('textBox');
const callBtn = document.getElementById('callBtn');
const overlay = document.getElementById('overlay');
const ringState = document.getElementById('ringState');
const acceptBtn = document.getElementById('acceptBtn');
const endBtn = document.getElementById('endBtn');

let active=false, playing=false, muted=false, stream;

toggleBtn.addEventListener('click', ()=>{
  active=!active;
  toggleBtn.setAttribute('aria-pressed', String(active));
  if(active){
    toggleBtn.textContent='Deactivate Mute Mode';
    emojiWrap.setAttribute('aria-hidden','false');
    textCard.setAttribute('aria-hidden','false');
    startCameraAndDetect();
  }else{
    toggleBtn.textContent='Activate Mute Mode';
    emojiWrap.setAttribute('aria-hidden','true');
    textCard.setAttribute('aria-hidden','true');
    stopCamera();
  }
});

async function startCameraAndDetect(){
  await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/weights/');
  await faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/weights/');
  stream = await navigator.mediaDevices.getUserMedia({video:true});
  video.srcObject=stream;
  video.addEventListener('play', ()=>{
    const interval = setInterval(async ()=>{
      if(!active){ clearInterval(interval); return; }
      const detections = await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
      if(detections.length>0){
        const expr = detections[0].expressions;
        let emoji='😐';
        if(expr.happy>0.6) emoji='😄';
        else if(expr.sad>0.6) emoji='😢';
        else if(expr.angry>0.6) emoji='😡';
        else if(expr.surprised>0.6) emoji='😲';
        emojiPlaceholder.innerText=emoji;
      }else{ emojiPlaceholder.innerText='😀'; }
    },500);
  });
}

function stopCamera(){
  if(stream) stream.getTracks().forEach(track=>track.stop());
  emojiPlaceholder.innerText='😀';
}

// Speaker button
speakerBtn.addEventListener('click', ()=>{
  if(playing){ speechSynthesis.cancel(); playing=false; speakerBtn.classList.remove('playing'); return; }
  const text=textBox.innerText.trim();
  if(!text) return;
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='en-US';
  utt.rate=1;
  utt.pitch=1;
  utt.onstart=()=>{ playing=true; speakerBtn.classList.add('playing'); };
  utt.onend=()=>{ playing=false; speakerBtn.classList.remove('playing'); };
  speechSynthesis.speak(utt);
});

// Mute person
callBtn.addEventListener('click', ()=>{
  muted=true;
  overlay.style.display='flex';
  overlay.setAttribute('aria-hidden','false');
  ringState.textContent='Person muted';
  const u=new SpeechSynthesisUtterance('Person muted'); speechSynthesis.speak(u);
});

acceptBtn.addEventListener('click', ()=>{
  muted=false;
  ringState.textContent='Person unmuted';
  const u=new SpeechSynthesisUtterance('Person unmuted'); speechSynthesis.speak(u);
  setTimeout(()=>{ overlay.style.display='none'; overlay.setAttribute('aria-hidden','true'); },1400);
});

endBtn.addEventListener('click', ()=>{
  overlay.style.display='none';
  overlay.setAttribute('aria-hidden','true');
});

overlay.addEventListener('click',(ev)=>{ if(ev.target===overlay){ overlay.style.display='none'; overlay.setAttribute('aria-hidden','true'); } });

speakerBtn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') speakerBtn.click(); });
</script>
</body>
</html>
