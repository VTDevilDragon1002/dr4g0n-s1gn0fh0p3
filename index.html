<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Neon Login</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f0f0f;
    }

    .box {
      position: relative;
      width: 350px;
      height: 400px;
      background: #1c1c1c;
      border-radius: 20px;
      overflow: hidden;
    }

    .box::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 50px #00f);
      border-radius: 20px;
      animation: rotating 4s linear infinite;
      animation-delay: -1s;
      border: 3px solid transparent;
      box-shadow: 0 0 30px #00f, 0 0 60px #0ff;
    }

    .box::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: #2d2d39;
      border-radius: 15px;
      border: 8px solid #25252b;
      z-index: 1;
    }

    @keyframes rotating {
      0% {
        transform: rotate(0deg);
        box-shadow: 0 0 30px #00f;
      }
      50% {
        box-shadow: 0 0 30px #f0f;
      }
      100% {
        transform: rotate(360deg);
        box-shadow: 0 0 30px #00f;
      }
    }

    form {
      position: relative;
      z-index: 2;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #fff;
    }

    h2 {
      letter-spacing: 2px;
      margin-bottom: 30px;
      color: #00ffff;
    }

    .inputBox {
      position: relative;
      width: 250px;
      margin-bottom: 25px;
    }

    .inputBox input {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: none;
      border-bottom: 2px solid #00ffff;
      color: #fff;
      outline: none;
      font-size: 16px;
    }

    .inputBox span {
      position: absolute;
      left: 0;
      padding: 10px 0;
      pointer-events: none;
      font-size: 16px;
      color: #aaa;
      transition: 0.5s;
    }

    .inputBox input:focus ~ span,
    .inputBox input:valid ~ span {
      transform: translateY(-20px);
      color: #00ffff;
      font-size: 12px;
    }

    .links {
      display: flex;
      justify-content: space-between;
      width: 250px;
      margin-bottom: 25px;
    }

    .links a {
      color: #aaa;
      font-size: 12px;
      text-decoration: none;
      transition: 0.3s;
    }

    .links a:hover {
      color: #00ffff;
    }

    input[type="submit"] {
      border: none;
      outline: none;
      padding: 10px 20px;
      background: #00ffff;
      color: #000;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    input[type="submit"]:hover {
      background: #0ff;
      box-shadow: 0 0 10px #0ff;
    }
  </style>
</head>

<body>
  <div class="box">
    <form action="home.html" method="get">
      <h2>LOGIN</h2>

      <div class="inputBox">
        <input type="text" required="required" />
        <span>Username</span>
      </div>

      <div class="inputBox">
        <input type="password" required="required" />
        <span>Password</span>
      </div>

      <div class="links">
        <a href="#">Forgot password?</a>
        <a href="#">Sign up</a>
      </div>

      <input type="submit" value="Sign in" />
    </form>
  </div>
</body>
</html>
